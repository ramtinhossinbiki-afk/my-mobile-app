name: Build Signed APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        working-directory: RAM_HUB_Mobile
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: RAM_HUB_Mobile
        run: ./gradlew assembleRelease

      - name: Build Release AAB
        working-directory: RAM_HUB_Mobile
        run: ./gradlew bundleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RAM-HUB-Release-APK
          path: RAM_HUB_Mobile/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: RAM-HUB-Release-AAB
          path: RAM_HUB_Mobile/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
