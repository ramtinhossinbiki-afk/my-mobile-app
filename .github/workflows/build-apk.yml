name: Build Signed Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        working-directory: RAM_HUB_Mobile
        run: ./gradlew assembleRelease

      - name: Generate signing keystore
        working-directory: RAM_HUB_Mobile
        run: |
          keytool -genkeypair \
            -v \
            -keystore release-key.jks \
            -alias ramhub \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }} \
            -dname "CN=RAM HUB, OU=Development, O=RAM HUB, L=Tehran, ST=Tehran, C=IR"

      - name: Sign Release APK
        working-directory: RAM_HUB_Mobile
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)/apksigner sign \
            --ks release-key.jks \
            --ks-key-alias ramhub \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out app/build/outputs/apk/release/RAM-HUB-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify APK signature
        working-directory: RAM_HUB_Mobile
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)/apksigner verify --verbose app/build/outputs/apk/release/RAM-HUB-release.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RAM-HUB-Signed-Release
          path: RAM_HUB_Mobile/app/build/outputs/apk/release/RAM-HUB-release.apk
